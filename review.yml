    type: HelpCenter
    note: Introduces Leap Connect API for ingesting transactional data; released 2024-03-22.
  - url: https://help.leapfin.com/space/PD/164364386/Leap+Connect+API+for+data+ingestion
    type: HelpCenter
    note: Leap Connect API for data ingestion.
  - url: https://help.leapfin.com/space/PD/185893090/About+Leapfin+accounting+records+and+links
    type: HelpCenter
    note: Financial/accounting records and the links that trace transactions across order-to-cash.
  - url: https://www.leapfin.com/product/overview
    type: ProductPage
    note: End-to-end workflow - ingest, transform, rules (GAAP/SOX/ASC 606), trace, explore (Luca AI), deliver journal entries and reports to ERPs.
  - url: https://www.leapfin.com/product/automated-revenue-recognition
    type: ProductPage
    note: Templated ASC 606 and IFRS revenue rules; journal entries per revenue activity.
  - url: https://apitracker.io/a/leapfin
    type: ThirdParty
    note: Reports OpenAPI/Swagger, Postman, and Insomnia collections exist plus webhooks; underlying spec not retrievable without auth.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Leapfin's one documented developer API
    (Leap Connect data ingestion) is request/response HTTPS push, and the full
    reference is partner/login-gated, so endpoints were modeled from public
    material and not fabricated. No AsyncAPI document was created because there is
    no documented server-push (WebSocket/SSE) transport on Leapfin's own API.
